# nginx for the live web container (Dockerfile.web). Included in the http context.

# Keep the caller's X-Request-ID; otherwise use nginx's own 32-hex request id, which
# the API's safe-token rule accepts, so a line in the nginx log and a line in the API
# log can be matched.
map $http_x_request_id $protloc_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API's own backstop is 2,000,000 characters per field; leave headroom.
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Docker's embedded DNS, resolved per request: nginx starts (and `nginx -t` passes)
    # even when the api container is not up yet, and follows it if it restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $protloc_api http://api:8010;

    location /demo/ {
        proxy_pass $protloc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $protloc_request_id;
        proxy_read_timeout 120s;
    }

    # Built assets carry a content hash in their names, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Single-page app: unknown paths serve index.html; index.html itself is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
