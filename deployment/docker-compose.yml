# Local development: the backend and the frontend, each in its own container,
# talking over the documented HTTP contract exactly as they will in production.
#
#     docker compose -f deployment/docker-compose.yml up --build
#
# The training image is deliberately absent. It needs a GPU, it is run
# deliberately rather than brought up alongside a dev server, and including it
# here would blur the separation the two Dockerfiles exist to enforce.

name: protloc-fusion

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.serve
    image: protloc-fusion-serve:dev
    # Values come from the developer's .env; the file is git-ignored and the
    # container gets no secret that is not in it.
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the container reads the rules and the registry, and a
      # container that cannot write to them cannot corrupt them.
      - ../backend/rules:/app/rules:ro
      - ../registry:/app/registry:ro
    healthcheck:
      test: ["CMD", "python", "-m", "protloc.config.settings"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    # npm ci, not npm install: the lockfile decides, so the container and CI
    # resolve the same tree.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      # Keeps the container's node_modules off the host tree, where a Linux
      # build would otherwise overwrite the developer's Windows one.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
