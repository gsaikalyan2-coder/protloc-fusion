      - config_hash
      - rules_version
      - experiment_id
      - job_id
      - status
      - sequence_count
      - created_at
      - updated_at
      - progress
      title: JobResource
      type: object
    JobStatus:
      description: 'The lifecycle of a prediction job.


        Every prediction is a job; a single sequence is a job of size one

        (ADR-0001). A job leaves a terminal state only by being resubmitted as a new

        job — statuses are never rewound.'
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
      title: JobStatus
      type: string
    OrganismGroup:
      description: 'The organism group a user selects alongside the sequence.


        Sorting signals and localization compartments differ enough between these

        groups that the model is conditioned on the choice rather than asked to infer

        it. The four groups follow the convention established by the signal-peptide

        literature the project benchmarks against.'
      enum:
      - eukarya
      - gram_positive
      - gram_negative
      - archaea
      title: OrganismGroup
      type: string
    PredictRequest:
      additionalProperties: false
      description: 'One sequence and the organism group to interpret it under.


        The organism group is required and has no default. Sorting signals and

        localization compartments differ enough between groups that guessing on the

        user''s behalf would silently change the answer, so the API asks rather than

        infers.


        Length and alphabet policy are deliberately absent. ``MAX_SEQUENCE_LENGTH``

        and the accepted residue alphabet are frozen in Phase 3 from the corpus''s own

        distribution; encoding a guess here would put an unmeasured constant into the

        contract, where changing it later is a breaking change.'
      properties:
        accession:
          anyOf:
          - type: string
          - type: 'null'
          description: An optional identifier echoed back in the result, so a caller submitting
            many single sequences can match responses to inputs. Not used by the model.
          title: Accession
        organism_group:
          $ref: '#/components/schemas/OrganismGroup'
          description: 'The organism group the sequence belongs to. Required: the model is
            conditioned on this choice rather than asked to infer it.'
        sequence:
          description: The amino-acid sequence, raw. Surrounding whitespace and FASTA headers
            are handled by the server; the length and alphabet policy is frozen in Phase 3
            and enforced from configuration, not from this schema.
          minLength: 1
          title: Sequence
          type: string
      required:
      - sequence
      - organism_group
      title: PredictRequest
      type: object
