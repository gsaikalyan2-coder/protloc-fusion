      additionalProperties: false
      description: The four reproducibility fields carried by every response, including 202
        and errors. They appear inline on each response rather than nested under a key; this
        schema names the group so a client can type it once. Every field is null while no
        registry bundle is loaded.
      properties:
        config_hash:
          anyOf:
          - type: string
          - type: 'null'
          description: Hash of the resolved Hydra configuration the bundle was produced under.
            null when no bundle is loaded.
          title: Config Hash
        experiment_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Identifier of the run manifest the bundle came from, e.g. EXP-0031.
            null when no bundle is loaded.
          title: Experiment Id
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the loaded registry bundle. null when no bundle is loaded,
