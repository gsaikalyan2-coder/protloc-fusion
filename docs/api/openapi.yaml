          minimum: 1.0
          title: Length
          type: integer
        organism_group:
          $ref: '#/components/schemas/OrganismGroup'
          description: The group this sequence was scored under.
        predictions:
          description: One entry per task that applies to this organism group. A task that
            does not apply is absent, not abstained.
          items:
            $ref: '#/components/schemas/TaskPrediction'
          title: Predictions
          type: array
        rules_checked:
          description: How many rules ran. Reported so that an empty violations list is readable
            as 'checked and clean' rather than 'not checked'.
          minimum: 0.0
          title: Rules Checked
          type: integer
        sequence_sha256:
          description: SHA-256 of the normalized sequence. The cache and dedup key.
          title: Sequence Sha256
          type: string
      required:
      - index
      - sequence_sha256
      - length
      - organism_group
      - predictions
      - consistency
      - rules_checked
      - attributions
      - evidence
      title: SequenceResult
      type: object
    Severity:
      description: 'How a biological-consistency violation is reported.


        The three levels come from ``docs/DESIGN.md`` §3.3 and mean different

        things: ``note`` and ``warning`` flag a prediction without altering it,

        while ``blocking`` forces abstention on the affected task. A violation never

        silently edits a prediction — the user sees what the model said and, beside

        it, what the rule set thinks of it. The rules themselves and their

        severities live in ``backend/rules/consistency_rules.yaml``, not in Python.'
      enum:
      - note
      - warning
      - blocking
      title: Severity
      type: string
    TaskAttribution:
      additionalProperties: false
      description: Per-residue attribution for one task.
      properties:
        residues:
          description: One entry per residue, in sequence order.
          items:
            $ref: '#/components/schemas/ResidueAttribution'
          title: Residues
          type: array
        task:
          $ref: '#/components/schemas/TaskName'
          description: The head being explained.
      required:
      - task
      - residues
      title: TaskAttribution
      type: object
    TaskName:
      description: 'The seven task heads sharing one trunk representation.


        Scope is fixed at seven by ``PROJECT_PLAN.md`` §3. A task is added by

        amending that section first, because each addition changes the multi-task

        loss, the label schema and the consistency rule set together.'
      enum:
      - localization
      - membrane_type
      - prokaryotic_localization
      - signal_peptide
      - mitochondrial_transit_peptide
      - chloroplast_transit_peptide
      - go_function
      title: TaskName
      type: string
    TaskPrediction:
      additionalProperties: false
      description: 'One task head''s answer for one sequence.


        Abstention and a low-confidence answer are different outcomes and are reported

        as such. When ``abstained`` is true the model declined because no label cleared

        the calibrated threshold, or because a blocking consistency violation forced

        it; ``labels`` is then empty rather than holding a best guess.


        A task that does not apply to the submitted organism group — prokaryotic

        localization for a eukaryotic sequence — is *masked*, not abstained, and is

        absent from the results list entirely. Scoring a task and declining is not the

        same as never having scored it, and conflating the two would misreport

        coverage.'
      properties:
        abstained:
          description: True when no label cleared the threshold, or when a blocking consistency
            violation forced abstention on this task.
          title: Abstained
          type: boolean
        abstention_threshold:
          description: The tau this head was scored against, read from calibrator metadata
            at prediction time. Reported so a user can reproduce the decision; it has no default
            because there is no default tau.
          title: Abstention Threshold
          type: number
        cleavage_site:
          anyOf:
          - type: integer
          - type: 'null'
          description: 1-based residue position of the predicted cleavage site, for the signal-
            and transit-peptide heads. null for every other task and when no site is predicted.
          title: Cleavage Site
        labels:
          description: Predicted labels, empty when abstained. Multi-label for localization
            and GO function, single-element otherwise. The label vocabulary comes from the
            registry bundle, not from this schema.
          items:
            type: string
          title: Labels
          type: array
        probabilities:
          additionalProperties:
            type: number
          description: Calibrated probability per candidate label. Present even when abstained,
            so a user can see how close the call was.
          title: Probabilities
          type: object
        task:
          $ref: '#/components/schemas/TaskName'
          description: Which of the seven heads produced this.
      required:
      - task
      - labels
      - probabilities
      - abstained
      - abstention_threshold
      title: TaskPrediction
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionResponse:
      additionalProperties: false
      description: The body of ``GET /version`` — what is loaded, and what it hashes to.
      properties:
        api_version:
          description: SemVer of the HTTP contract itself.
          title: Api Version
          type: string
        checksums:
          additionalProperties:
            type: string
          description: SHA-256 of each artifact in the loaded bundle, by filename. Empty when
            no bundle is loaded.
          title: Checksums
          type: object
        config_hash:
          anyOf:
          - type: string
          - type: 'null'
          description: Hash of the resolved Hydra configuration the bundle was produced under.
            null when no bundle is loaded.
          title: Config Hash
        experiment_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Identifier of the run manifest the bundle came from, e.g. EXP-0031.
            null when no bundle is loaded.
          title: Experiment Id
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the loaded registry bundle. null when no bundle is loaded,
            which is the case until Phase 7 packages bundle v0.
          title: Model Version
        rules_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the biological-consistency rule set that scored this response.
            null when no rule set is loaded.
          title: Rules Version
        service_version:
          description: SemVer of the running service package.
          title: Service Version
          type: string
      required:
      - model_version
      - config_hash
      - rules_version
      - experiment_id
      - api_version
      - service_version
      - checksums
      title: VersionResponse
      type: object
info:
  contact:
    name: ProtLoc Fusion
    url: https://github.com/gsaikalyan2-coder/protloc-fusion
  description: 'Unified protein annotation from one shared representation: one sequence and
    one

    organism group in, seven annotations out, with calibrated probabilities,

    abstention, biological-consistency flags, per-residue explanation and independent

    database evidence.


    **The contract is asynchronous.** `POST /predict` returns `202 Accepted` with a

    job identifier and a result URL, never a prediction. A single sequence is a job

    of size one; there is exactly one inference path, so the answer a user gets is

    the answer the paper measures (ADR-0001).


    **Every response carries provenance.** `model_version`, `config_hash`,

    `rules_version` and `experiment_id` appear on every body, including acceptances

    and errors. They are `null` when no registry bundle is loaded.


    **Result URLs are unguessable but not private.** A `job_id` is a UUIDv4; anyone

    holding the URL can read the result. Results expire after a retention window.

    '
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  summary: Seven protein annotations from one shared representation.
  title: ProtLoc Fusion
  version: 1.0.0
openapi: 3.1.0
paths:
  /batch:
    post:
      description: 'Accept a FASTA upload as one job.


        Async because reading the upload is I/O. The size cap is enforced by

        ``MAX_UPLOAD_BYTES`` in Phase 15, not by a constant here; parsing the FASTA

        belongs to the job service, which is why the bytes are handed over whole.'
      operationId: batch_batch_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchSubmission'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          description: The job was accepted. `sequence_count` reports how many were parsed.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request does not match the contract. `error` is `validation_failed`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded, so no work can be accepted. `error` is
            `no_registry_bundle`.
      summary: Submit a FASTA file. Returns a job
      tags:
      - prediction
  /examples:
    get:
      description: Return the gallery.
      operationId: examples_examples_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesResponse'
          description: The gallery in display order. Each entry carries its computed_at.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded. The gallery's entries are cached results,
            which require the model that produced them. `error` is `no_registry_bundle`.
      summary: Gallery sequences with pre-computed, cached results
      tags:
      - examples
  /health:
    get:
      description: 'Report liveness.


        Answers ``200`` whenever the process is up, including when it cannot

        predict — a probe that fails while the service is correctly serving its

        contract would restart a container that is working. Inability to predict is

        reported in ``status``, not in the status code.'
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: The service is answering. Read `status` for whether it can predict.
      summary: Liveness, what is loaded, and how deep the queue is
      tags:
      - service
  /jobs/{job_id}:
    get:
      description: 'Return the job.


        This is the URL in ``result_url``. It is safe to poll: it answers ``200`` for

        a queued, running, completed, failed or cancelled job alike, and the client

        reads ``status`` rather than branching on a status code.'
      operationId: read_job_jobs__job_id__get
      parameters:
      - description: The job's UUIDv4, as returned at acceptance.
        in: path
        name: job_id
        required: true
        schema:
          description: The job's UUIDv4, as returned at acceptance.
          format: uuid
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResource'
          description: The job resource. `results` is populated only when `status` is `completed`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such job. `error` is `not_found`.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The job existed and its retention window closed. `error` is `job_expired`.
            Distinct from 404 deliberately: a user holding an old URL is told it expired,
            never that it never existed.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded. `error` is `no_registry_bundle`.
      summary: The job, in whatever state it is in
      tags:
      - jobs
  /jobs/{job_id}/cancel:
    post:
      description: 'Cancel the job.


        Cancelling a job that already reached a terminal state is not an error: the

        caller''s intent — that this job not run — is already satisfied, and returning

        ``409`` for it would make a retry after a network failure look like a bug.'
      operationId: cancel_job_jobs__job_id__cancel_post
      parameters:
      - description: The job's UUIDv4, as returned at acceptance.
        in: path
        name: job_id
        required: true
        schema:
          description: The job's UUIDv4, as returned at acceptance.
          format: uuid
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
          description: '`cancelled` says whether this call changed anything.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such job. `error` is `not_found`.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The job existed and its retention window closed. `error` is `job_expired`.
            Distinct from 404 deliberately: a user holding an old URL is told it expired,
            never that it never existed.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded. `error` is `no_registry_bundle`.
      summary: Stop a queued or running job
      tags:
      - jobs
  /jobs/{job_id}/results:
    get:
      description: 'Return the results as a download.


        Never returns a partial result: a job that has not completed is a ``409``,

        because a truncated download that looks complete is worse than a refusal.'
      operationId: download_results_jobs__job_id__results_get
      parameters:
      - description: The job's UUIDv4, as returned at acceptance.
        in: path
        name: job_id
        required: true
        schema:
          description: The job's UUIDv4, as returned at acceptance.
          format: uuid
          title: Job Id
          type: string
      - description: json preserves the full nested result; csv flattens one row per sequence
          and task, and necessarily omits per-residue attribution.
        in: query
        name: format
        required: false
        schema:
          default: json
          description: json preserves the full nested result; csv flattens one row per sequence
            and task, and necessarily omits per-residue attribution.
          enum:
          - json
          - csv
          title: Format
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
            text/csv: {}
          description: The results, as an attachment.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such job. `error` is `not_found`.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The job has not completed, so it has no results. `error` is `results_not_ready`.
            Poll `GET /jobs/{job_id}` instead.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The job existed and its retention window closed. `error` is `job_expired`.
            Distinct from 404 deliberately: a user holding an old URL is told it expired,
            never that it never existed.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded. `error` is `no_registry_bundle`.
      summary: Download a completed job's results
      tags:
      - jobs
  /predict:
    post:
      description: 'Accept one sequence as a job of size one.


        This endpoint does not return a prediction, and no future version of it will:

        that is the contract, not a property of the current implementation. A

        size-one job that finishes inside the inline window may be answered with

        ``200`` and a job resource as a convenience, but a client that assumes ``200``

        is broken against any deployment that happens to be busy.'
      operationId: predict_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          description: The job was accepted. Poll `result_url` for status and, once completed,
            results.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request does not match the contract. `error` is `validation_failed`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No registry bundle is loaded, so no work can be accepted. `error` is
            `no_registry_bundle`.
      summary: Submit one sequence. Returns a job, never a prediction
      tags:
      - prediction
  /version:
    get:
      description: 'Report what is running.


        ``api_version`` is the contract''s version and ``service_version`` the

        package''s; they move independently, because a bug fix that changes no shape

        must not look like a contract change to a client pinning one.'
      operationId: service_version_version_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
          description: Everything needed to identify exactly what answered.
      summary: Contract version, service version and bundle checksums
      tags:
      - service
tags:
- description: Liveness and what is loaded.
  name: service
- description: Submitting work. Always asynchronous.
  name: prediction
- description: Following work and reading results.
  name: jobs
- description: The gallery, with pre-computed results.
  name: examples
