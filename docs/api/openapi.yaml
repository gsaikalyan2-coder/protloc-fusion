        job_id:
          description: The job's identifier.
          format: uuid
          title: Job Id
          type: string
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the loaded registry bundle. null when no bundle is loaded,
            which is the case until Phase 7 packages bundle v0.
          title: Model Version
        progress:
          $ref: '#/components/schemas/JobProgress'
          description: Counts, valid at every status.
        queue_position:
          anyOf:
          - type: integer
          - type: 'null'
          description: Jobs ahead of this one. null once running or terminal.
          title: Queue Position
        results:
          anyOf:
          - items:
              $ref: '#/components/schemas/SequenceResult'
            type: array
          - type: 'null'
          description: Present only when status is completed. null otherwise — a running job
            has no partial results to offer, and a failed one has an error.
          title: Results
        rules_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the biological-consistency rule set that scored this response.
            null when no rule set is loaded.
          title: Rules Version
        sequence_count:
          description: Sequences submitted.
          minimum: 1.0
          title: Sequence Count
          type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
          description: queued, running, completed, failed or cancelled.
        updated_at:
          description: When the status last changed. Timezone-aware, always UTC.
          format: date-time
          title: Updated At
