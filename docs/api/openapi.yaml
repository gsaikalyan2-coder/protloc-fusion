          title: Model Version
        rules_version:
          anyOf:
          - type: string
          - type: 'null'
          description: SemVer of the biological-consistency rule set that scored this response.
            null when no rule set is loaded.
          title: Rules Version
      required:
      - model_version
      - config_hash
      - rules_version
      - experiment_id
      title: ReproducibilityEnvelope
      type: object
    ResidueAttribution:
      additionalProperties: false
      description: One residue's contribution to one task's prediction.
      properties:
        position:
          description: 1-based position in the normalized sequence.
          minimum: 1.0
          title: Position
          type: integer
        residue:
          description: The single-letter amino-acid code at this position.
          maxLength: 1
          minLength: 1
          title: Residue
          type: string
        score:
          description: Signed attribution. Positive supports the predicted label, negative
            argues against it. Comparable within one task and sequence only — never across
            tasks, and never as a probability.
          title: Score
          type: number
      required:
      - position
      - residue
      - score
      title: ResidueAttribution
      type: object
