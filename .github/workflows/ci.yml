# ProtLoc Fusion — continuous integration.
#
# Every job below is required. Two of them are the reason this file is worth
# writing carefully:
#
#   backend-test   runs test_layering.py, which fails on an architecture
#                  violation rather than leaving the layering aspirational.
#   tokens-current regenerates tokens.css from docs/DESIGN.md and fails on a
#                  diff, which catches a hand-edited token file.
#   openapi-current  and types-current do the same for the two artifacts Phase 2
#   types-current    froze: docs/api/openapi.yaml is regenerated from the FastAPI
#                    application, and frontend/src/types/api.generated.ts from
#                    that document. A backend schema change that breaks the
#                    frontend fails at build time rather than in a browser.
#
# The docker-build job asserts the separation between the two images: the
# training image must have needleall, and the serving image must NOT be able to
# import torch. That check is deliberately inverted — it proves the images are
# genuinely separate rather than sharing a base by accident.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: backend · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the dev extra
        run: pip install -e "backend[dev]"
      - name: ruff check
        run: ruff check backend
      - name: ruff format --check
        run: ruff format --check backend
      - name: ruff check (scripts, under the backend rule set)
        run: ruff check --config backend/ruff.toml scripts

  backend-types:
    name: backend · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "backend[dev]"
      # PHASE_01 §5 check 4. Widened to inference/ in Phase 7, when it has code.
      # Run from backend/, because [tool.mypy] — including the pydantic plugin
      # that makes BaseSettings type-check — lives in backend/pyproject.toml and
      # mypy only discovers it from there. Running this from the repository root
      # silently drops the plugin and reports five false errors.
      - name: mypy (strict)
        working-directory: backend
        run: python -m mypy protloc/domain protloc/config

  backend-test:
    name: backend · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # `data` carries biopython, which the Phase 3 parser tests import.
      - run: pip install -e "backend[dev,data]"
      - name: pytest
        working-directory: backend
        run: python -m pytest tests

  frontend-lint:
    name: frontend · lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npx eslint . --max-warnings 0
      - name: prettier
        run: npx prettier --check .

  frontend-build:
    name: frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: vite build
        run: npm run build
      - name: dist/ was produced
        run: test -f dist/index.html

  tokens-current:
    name: tokens · generated, not hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Regenerate from docs/DESIGN.md
        run: python scripts/generate_tokens.py
      - name: The committed file must match
        run: git diff --exit-code -- frontend/src/styles/tokens.css

  frontend-deps:
    name: frontend · React only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # CLAUDE.md: no CSS framework, no component library, every version pinned.
      - run: python scripts/check_frontend_deps.py

  openapi-current:
    name: contract · generated, not hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "backend[dev]" pyyaml
      # docs/api/openapi.yaml is a projection of the FastAPI application, the
      # same arrangement that protects tokens.css. A schema change nobody
      # regenerated is a red build here rather than a frontend that compiles
      # against a contract the backend no longer serves.
      - name: Regenerate the contract
        run: python scripts/export_openapi.py
      - name: The committed document must match
        run: git diff --exit-code -- docs/api/openapi.yaml

  types-current:
    name: frontend · types generated from the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # This is the job that retires Phase 1's KNOWN GAPS 5: api.ts used to
      # mirror the backend's enums by hand and nothing checked that they agreed.
      # Now a backend schema change that breaks the frontend fails here, at build
      # time, rather than in somebody's browser.
      - name: Regenerate the types
        working-directory: frontend
        run: npm run generate:types
      - name: The committed types must match
        run: git diff --exit-code -- frontend/src/types/api.generated.ts

  secrets-scan:
    name: repo · no secret values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env.example carries placeholders only
        run: |
          if grep -nE '(API_KEY|SECRET|TOKEN|DSN|PASSWORD)=' .env.example \
             | grep -v 'ENTER_YOUR_VALUE_HERE'; then
            echo "::error::.env.example contains a filled-in secret"
            exit 1
          fi
      - name: no .env is committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; it must never be committed"
            exit 1
          fi

  docker-build:
    name: docker · both images, genuinely separate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # A GitHub-hosted runner ships ~14 GB free and arrives preloaded with
      # toolchains this job never uses. The CUDA base plus EMBOSS plus a cache
      # export exhausted it on the first run:
      #   write /usr/share/EMBOSS/data/TAXONOMY/nodes.dmp: no space left on device
      # Removing the preloaded toolchains reclaims roughly 25 GB.
      - name: Reclaim runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Build the serving image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile.serve
          tags: protloc-serve:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the training image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile.train
          tags: protloc-train:ci
          load: true
          cache-from: type=gha
          # mode=min, not max: exporting every intermediate layer of a multi-GB
          # CUDA image doubles the disk this job needs, and no other job reuses
          # those layers.
          cache-to: type=gha,mode=min

      # PHASE_01 §5 check 12.
      - name: Training image has EMBOSS needleall
        run: docker run --rm protloc-train:ci which needleall

      # PHASE_01 §5 check 13, deliberately inverted: the serving image MUST fail
      # to import torch. If it succeeds, the two images are sharing a base and
      # the train/serve separation is decorative.
      - name: Serving image cannot import torch
        run: |
          if docker run --rm protloc-serve:ci python -c "import torch" 2>/dev/null; then
            echo "::error::the serving image can import torch; the images are not separate"
            exit 1
          fi
          echo "torch is absent from the serving image, as required"

      # The CMD is now uvicorn, so this check can no longer run the container to
      # completion and read its exit code — it would hang until the job times
      # out. The config gate still exists, inside create_app(), and is asserted
      # here by invoking the validator as an explicit command override. Both
      # halves are kept: the refusal on an empty environment, and the success on
      # a complete one.
      - name: Serving image still refuses an incomplete configuration
        run: |
          if docker run --rm protloc-serve:ci python -m protloc.config.settings 2>/dev/null; then
            echo "::error::the config validator accepted an empty environment"
            exit 1
          fi
          docker run --rm \
            -e APP_ENV=development -e LOG_LEVEL=INFO \
            -e API_HOST=0.0.0.0 -e API_PORT=8000 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            protloc-serve:ci python -m protloc.config.settings

      # And the check that proves the image now *serves* the application rather
      # than merely containing it. `degraded` is the expected status: no registry
      # bundle exists until Phase 7, and /health answering 200 while saying so is
      # the contract this phase froze.
      - name: Serving image serves the API
        run: |
          docker run -d --name protloc-serve-ci -p 8000:8000 \
            -e APP_ENV=development -e LOG_LEVEL=INFO \
            -e API_HOST=0.0.0.0 -e API_PORT=8000 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            protloc-serve:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::/health never answered"
              docker logs protloc-serve-ci
              docker rm -f protloc-serve-ci
              exit 1
            fi
            sleep 1
          done
          cat /tmp/health.json
          python -c "import json,sys; b=json.load(open('/tmp/health.json')); \
            assert b['status'] == 'degraded', b; \
            assert b['bundle_loaded'] is False, b; \
            assert b['model_version'] is None, b; \
            print('health reports degraded with a null envelope, as specified')"
          docker rm -f protloc-serve-ci

  compose-valid:
    name: docker · compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f deployment/docker-compose.yml config > /dev/null
          docker compose -f deployment/docker-compose.live.yml config > /dev/null
          docker compose -f deployment/docker-compose.live.yml -f deployment/docker-compose.encoder.yml config > /dev/null

  # The live stack (docker-compose.live.yml): the trained-engine API image and the
  # web image. Model data is gitignored, so CI cannot serve a prediction; it proves
  # what can be proven without it: both images build, the API image has no torch
  # and imports the live app, the API refuses to start without its registry (and
  # says why), and nginx serves the SPA and forwards /demo.
  docker-live:
    name: docker · live API and web images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the live API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile.live
          tags: protloc-live-api:ci
          load: true
          cache-from: type=gha,scope=live-api
          cache-to: type=gha,mode=max,scope=live-api

      - name: Build the live web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile.web
          tags: protloc-live-web:ci
          load: true
          cache-from: type=gha,scope=live-web
          cache-to: type=gha,mode=max,scope=live-web

      - name: Live API image has no torch and imports the live app
        run: |
          if docker run --rm protloc-live-api:ci python -c "import torch" 2>/dev/null; then
            echo "::error::the live API image can import torch"
            exit 1
          fi
          docker run --rm protloc-live-api:ci python -c "import protloc.api.app_v2, protloc.inference.engine; print('live app imports')"

      - name: Live API refuses to start without its registry, and says why
        run: |
          set +e
          timeout 120 docker run --rm \
            -e MODEL_REGISTRY=/app/registry -e MODEL_SERVING_MODE=queue \
            -e MODEL_VERSION=localization-0.10.0+signal_peptide-0.11.0+go_function-0.12.0+evidence_homology-0.13.0 \
            -e MAX_BATCH_SEQUENCES=20 -e INLINE_RESULT_WINDOW_SECONDS=2 -e JOB_RETENTION_HOURS=1 \
            -e DATA_ROOT=/app/data -e EMBED_CACHE=/app/data/embeddings \
            -e EVIDENCE_ROOT=/app/data/evidence -e SWISSPROT_DB_PATH=/app/data/evidence/swissprot_mmseqs \
            -e EVIDENCE_TIMEOUT_SECONDS=5 -e EVIDENCE_TOP_K=5 \
            protloc-live-api:ci > /tmp/live.log 2>&1
          code=$?
          set -e
          cat /tmp/live.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::the live API started (or hung) without a registry; exit $code"
            exit 1
          fi
          grep -q "will not start" /tmp/live.log

      - name: Live web image serves the app and forwards /demo
        run: |
          docker run --rm protloc-live-web:ci nginx -t
          docker run -d --name protloc-live-web-ci -p 8080:8080 protloc-live-web:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html && break
            sleep 1
          done
          grep -q '<div id="root">' /tmp/index.html
          curl -fsS http://127.0.0.1:8080/gallery -o /dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/demo/health)
          echo "/demo/health without an api container: $status"
          docker rm -f protloc-live-web-ci
          [ "$status" = "502" ]
