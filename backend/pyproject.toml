[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "protloc"
version = "0.1.0"
description = "ProtLoc Fusion — unified protein annotation from one shared representation"
# No `readme` key: setuptools refuses to read a file outside the package root,
# and the project README lives at the repository root by design.
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Saikalyan", email = "gsaikalyan2@gmail.com" }]
keywords = ["bioinformatics", "protein", "subcellular-localization", "protein-language-model"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Exact pins only. A caret or tilde range means the scaffold that passes CI today
# fails in three months on a transitive bump, and a training run stops being
# reproducible. Heavier dependencies (torch, transformers, peft, netcal, hydra,
# mmseqs2 bindings) arrive in the phase that first uses them — not before.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  # POST /batch is a multipart FASTA upload, so Starlette needs a form parser.
  # FastAPI raises at route-definition time without it, which makes this a hard
  # dependency of the frozen contract rather than a convenience.
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "hydra-core==1.3.6",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "mypy==2.3.1",
  "httpx==0.28.1",
  "types-PyYAML==6.0.12.20260906",
]

# Corpus construction (Phase 3). Separate from the serving dependencies:
# Dockerfile.serve installs neither extra, so none of this reaches the served image.
data = [
  "biopython==1.88",
  "pyyaml==6.0.3",
]
# Classical baselines (Phase 8). Exact pins like everything else; training/ is never
# imported by the serving path, so none of this reaches the served image.
baselines = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "pyyaml==6.0.3",
]
# Localization head (Phase 9). Exact pins; training/ is never imported by the serving path,
# so none of this reaches the served image. The head reads per-residue states through the
# cache API and needs only torch and numpy; PyYAML reads configs/training/head.yaml.
head = [
  "torch==2.14.1",
  "numpy==2.4.6",
  "pyyaml==6.0.3",
]
# The served engine (Phase 14, ADR-0016). Inference is plain numpy: torch is a training
# dependency and the serving path never imports it, so Dockerfile.serve installs `.[serve]`
# and nothing heavier. The exact version equals the one the parity test was run against.
serve = [
  "numpy==2.4.6",
]
# Data versioning. Kept apart from `data` because CI never needs it and it pulls
# in a large dependency tree.
dvc = [
  "dvc==3.67.1",
]

[project.urls]
Repository = "https://github.com/gsaikalyan2-coder/protloc-fusion"

[tool.setuptools.packages.find]
where = ["."]
include = ["protloc*"]

[tool.setuptools.package-data]
protloc = ["py.typed"]

# ── mypy ─────────────────────────────────────────────────────────────────────
# Strict everywhere. CI gates `domain/`, `config/` and — from Phase 3 — `data/`;
# the settings below apply to whatever is checked.
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_explicit = false
no_implicit_reexport = true
show_error_codes = true
pretty = true

# Legacy motif engine and its synthetic reference set (Phase 0 promotion, kept for the Scanner,
# the golden baseline and the Phase 3 tests; Phase 14 serves none of their model outputs).
# They were never type-annotated and the golden set pins their behaviour byte for byte, so they
# are excluded from the type gate instead of edited. Every new serving module is strict.
[[tool.mypy.overrides]]
module = [
  "protloc.inference.motif",
  "protloc.features.classical",
  "protloc.data.reference_demo",
]
ignore_errors = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: exercises more than one module together",
  "golden: asserts behaviour on the fixed golden protein set",
]
