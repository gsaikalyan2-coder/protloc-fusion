# Phase 11 signal-peptide CRF head: frozen per-residue ESM-2 states -> CNN or BiLSTM -> linear-chain CRF.
#
# Data, not code. Every architecture setting, tag, cap, grid axis and tolerance the head uses lives
# here; backend/protloc/training/crf.py reads this file and repeats none of it, and
# tests/unit/test_crf.py fails if the two ever disagree. scripts/crf.py hashes this file into the
# frozen manifest, so changing it after --freeze is caught by `scripts/crf.py --check`.
# Confirmed at the Phase 11 gates (ADR-0013).

name: crf
task: signal_peptide

# Must equal `seed` in configs/config.yaml (a unit test asserts it).
seed: 20260909

architecture:
  # Must equal model.trunk.embedding_dim (a unit test asserts it).
  embedding_dim: 640
  # Each sequence is cut to its first `length_cap` residues. A signal peptide is N-terminal, so the
  # cut loses nothing it could label; every residue beyond the cap is tagged outside (O) and the
  # decoded path never extends past it. A positive whose cleavage site lies beyond the cap is masked
  # in the tag loss and counted in the report.
  length_cap: 100
  # Two Conv1d layers (odd kernel, same padding), GELU, dropout; padded positions are zeroed before every layer.
  cnn:
    hidden: 64
    kernel: 5
    layers: 2
  # One bidirectional LSTM layer; padding is removed by packing, so it cannot change a real position.
  bilstm:
    hidden: 64
    layers: 1

# Gate B: signal-peptide only. Mitochondrial and chloroplast transit peptides have fewer than
# `min_cleavage_positives` positives that carry a cleavage site on the subset, so they are marked
# undefined and never trained (scripts/crf.py records the counts and --check re-verifies them).
tags:
  names: [O, S]
  outside: O
  signal: S
  # (from, to) pairs scored as forbidden: no S after O, so S is contiguous from residue 1.
  forbidden_transitions:
    - [O, S]
  # Added in place of a learned transition score; exp() of it underflows to exactly 0.
  forbidden_score: -10000.0
  undefined_tasks: [mitochondrial_transit_peptide, chloroplast_transit_peptide]
  min_cleavage_positives: 20

grid:
  # Order of expansion: encoder (slowest), learning_rate, dropout. 2 x 2 x 2 = 8 points.
  encoder: [cnn, bilstm]
  learning_rate: [0.001, 0.0003]
  dropout: [0.3, 0.5]

optimiser:
  name: adamw
  weight_decay: 0.01

schedule:
  batch_size: 32
  max_epochs: 80
  # Early stopping watches the NEGATIVE mean tag-sequence NLL on an inner whole-cluster holdout.
  patience: 10
  inner_holdout_fraction: 0.2

# The selection metric (Gate C): mean over the four folds of cleavage accuracy within +- `tolerance`
# residues among that fold's true positives; ties go to the higher mean fold detection MCC, then to
# the earlier grid point.
selection:
  tolerance: 1

evaluation:
  # Exact match is always reported; these are the extra tolerances, in residues.
  tolerances: [1, 2, 3]
  # An organism group gets its own row only if it has at least this many positives.
  group_min_support: 20
  # The raw detection scores recomputed from the saved fold weights must agree with the scores
  # --train wrote to within this absolute difference, or --evaluate fails.
  reproduction_tolerance: 1.0e-9

# The frozen detection calibrator and its threshold: registry/<task>/<version>/ (ADR-0013).
bundle:
  version: 0.11.0
  directory: registry/signal_peptide

# The Phase 10 calibration machinery is reused unchanged: same eligibility rule, Platt numerics and ECE bins.
calibration:
  config: configs/training/calibration.yaml

# TargetP's published cleavage-site accuracies, quoted as context ONLY. They come from a different
# benchmark, split and label set; they are never compared with, subtracted from or tabulated against a number here.
context:
  targetp:
    signal_peptide_cleavage_accuracy: 0.83
    transit_peptide_cleavage_accuracy: [0.46, 0.49]
    comparable: false

# `scripts/crf.py --smoke`: every 4th row, a code check only, never frozen, no number from it is reported.
smoke:
  stride: 4
  max_epochs: 2
  grid_points: 2
